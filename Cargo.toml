[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
vfs = { path = "crates/vfs" }
pagefile = { path = "crates/pagefile" }
